name: Portfolio Guardian

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  deployment_status:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  quality:
    name: Validate portfolio
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript validation
        id: typescript
        run: npm run lint

      - name: Run production build
        id: build
        run: npm run build

      - name: Validate configured repository paths
        id: project-references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run guardian:repo

      - name: Run configured link check
        id: links
        run: npm run guardian:links

      - name: Record dependency audit
        run: npm audit --audit-level=high --json > guardian/reports/npm-audit.json || true

      - name: Run browser and accessibility checks
        id: browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx playwright test tests/e2e/home.spec.ts tests/e2e/accessibility.spec.ts

      - name: Generate Guardian report
        if: always()
        env:
          GUARDIAN_TYPESCRIPT_STATUS: ${{ steps.typescript.outcome == 'success' && 'passed' || 'failed' }}
          GUARDIAN_BUILD_STATUS: ${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}
          GUARDIAN_PLAYWRIGHT_STATUS: ${{ steps.browser.outcome == 'success' && 'passed' || 'failed' }}
          GUARDIAN_ACCESSIBILITY_STATUS: ${{ steps.browser.outcome == 'success' && 'passed' || 'failed' }}
          GUARDIAN_LINKS_STATUS: ${{ steps.links.outcome == 'success' && 'passed' || 'failed' }}
          GUARDIAN_PROJECT_REFERENCES_STATUS: ${{ steps.project-references.outcome == 'success' && 'passed' || 'failed' }}
        run: npm run guardian:report -- --environment=ci

      - name: Collect Guardian evidence
        if: always()
        run: npm run guardian:evidence

      - name: Upload Guardian reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-quality-reports
          path: |
            guardian/reports/
            guardian-evidence/
            guardian-report.*
            playwright-report/
            test-results/
          if-no-files-found: ignore

  production:
    name: Smoke test production
    if: >-
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch') &&
      vars.PORTFOLIO_URL != ''
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke test
        id: production-smoke
        run: npx playwright test tests/e2e/production.spec.ts

      - name: Run production link check
        id: production-links
        run: npm run guardian:links

      - name: Run Lighthouse CI
        id: lighthouse
        run: npx lhci autorun --collect.url="$PORTFOLIO_URL"

      - name: Generate production Guardian report
        if: always()
        env:
          GUARDIAN_PRODUCTION_STATUS: ${{ steps.production-smoke.outcome == 'success' && 'passed' || 'failed' }}
          GUARDIAN_LINKS_STATUS: ${{ steps.production-links.outcome == 'success' && 'passed' || 'failed' }}
          GUARDIAN_LIGHTHOUSE_STATUS: ${{ steps.lighthouse.outcome == 'success' && 'passed' || 'failed' }}
        run: npm run guardian:report -- --environment=production

      - name: Collect production evidence
        if: always()
        run: npm run guardian:evidence

      - name: Upload production reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-production-reports
          path: |
            guardian/reports/
            guardian-evidence/
            guardian-report.*
            .lighthouseci/
            playwright-report/
            test-results/
          if-no-files-found: ignore