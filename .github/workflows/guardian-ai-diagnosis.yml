name: Guardian AI Diagnosis

on:
  workflow_run:
    workflows: ["Guardian Issue Activation"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    name: Diagnose Guardian issues
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download issue handoff evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name guardian-issue-activation --dir .

      - name: Run structured AI diagnosis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run guardian:diagnose-issues

      - name: Upload diagnosis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guardian-ai-diagnosis
          path: |
            guardian/reports/diagnosis-results.json
            guardian-ai-diagnosis.json
            guardian-ai-diagnosis.md
          if-no-files-found: error