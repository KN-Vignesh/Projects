name: Guardian Dry Run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Requested mode; only dry-run is accepted by this workflow'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - observe
          - active

permissions:
  contents: read

jobs:
  reject-unsupported-mode:
    name: Reject non-dry-run mode
    if: inputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - name: Stop before any automation
        run: echo "Only dry-run is enabled; requested mode '${{ inputs.mode }}' is blocked." && exit 1

  dry-run:
    name: Simulate Guardian automation
    if: inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    env:
      GUARDIAN_ENVIRONMENT: dry-run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Guardian dry-run pipeline
        run: npm run guardian:dry-run

      - name: Generate dry-run report
        run: npm run guardian:report -- --environment=dry-run

      - name: Collect dry-run evidence
        run: npm run guardian:evidence

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guardian-dry-run
          path: |
            guardian-evidence/
            guardian-report.*
            guardian-issue-preview.md
            guardian-ai-diagnosis.*
            guardian-repair-plan.*
            guardian-branch-preview.json
            guardian-pr-preview.md
          if-no-files-found: error
