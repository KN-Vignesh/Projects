name: Guardian Issue Activation

on:
  workflow_run:
    workflows: ["Portfolio Guardian"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  create-or-update:
    name: Create or update Guardian issues
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download quality evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name guardian-quality-reports --dir . || true

      - name: Download production evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name guardian-production-reports --dir . || true

      - name: Create or update Guardian issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run guardian:issues

      - name: Upload issue handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: guardian-issue-activation
          path: guardian/reports/issue-results.json
          if-no-files-found: error