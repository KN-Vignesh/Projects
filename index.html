<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vignesh K N — AI Engineer</title>
  <meta name="description" content="AI Engineering portfolio of Vignesh K N — LLM adaptation, machine learning systems, evaluation and experiments.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F0F1FA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/portfolio.css">
</head>

<body>
  <div class="site-grain" aria-hidden="true"></div>
  <div id="app">Loading portfolio…</div>

  <script>
    window.$docsify = {
      name: "VIGNESH K N",
      repo: "KN-Vignesh/Projects",
      relativePath: false,
      auto2top: true,
      executeScript: true,
      loadSidebar: true,
      loadNavbar: true,
      mergeNavbar: true,
      maxLevel: 3,
      subMaxLevel: 0,
      coverpage: true,
      homepage: "README.md",

      search: {
        maxAge: 86400000,
        paths: "auto",
        placeholder: "Search projects",
        noData: "No matching project",
        depth: 4,
        hideOtherSidebarContent: false
      },

      plugins: [
        function (hook, vm) {
          hook.afterEach(function (html) {
            return html;
          });

          hook.doneEach(function () {
            const current = document.querySelector(".sidebar-toggle");
            if (current) current.setAttribute("aria-label", "Toggle project navigation");
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="assets/portfolio.js"></script>
</body>
</html>
